name: Push Branch Validator

on:
  push:
    branches-ignore:
      - 'main'
      - 'master'

jobs:
  validate_branch:
    name: Validate branch prefix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Branch Prefix
        shell: bash
        run: |
          BRANCH="${{ github.ref_name }}"
          echo "Branch detected: '$BRANCH'"

          if echo "$BRANCH" | grep -Eq '^(feature/|bugfix/|hotfix/)'; then
            echo "✅ El nombre de rama '$BRANCH' cumple la convención."
            exit 0
          else
            echo "::error::Nombre de rama inválido: '$BRANCH'. Debe comenzar con 'feature/', 'bugfix/' o 'hotfix/'."
            exit 1
          fi
